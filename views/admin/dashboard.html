<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Elriel Terminal</title>
    <link rel="stylesheet" href="/css/terminal.css">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            padding: 20px;
            text-align: center;
        }

        .stat-card h3 {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            color: #00ff00;
            font-size: 36px;
            font-weight: bold;
        }

        .admin-section {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid #00ff00;
            padding: 20px;
            margin-bottom: 20px;
        }

        .admin-section h2 {
            color: #00ff00;
            margin-bottom: 15px;
            border-bottom: 1px solid #00ff00;
            padding-bottom: 10px;
        }

        .admin-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .admin-actions button {
            padding: 10px 20px;
            background: #00ff00;
            border: none;
            color: #000;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-actions button:hover {
            background: #00dd00;
        }

        .user-list, .activity-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .user-item, .activity-item {
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid #00ff00;
            padding: 10px;
            margin-bottom: 10px;
        }

        .user-item:hover, .activity-item:hover {
            background: rgba(0, 255, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="terminal-header">
        <h1>ELRIEL ADMIN TERMINAL</h1>
        <p class="subtitle">System Administration Console</p>
    </div>

    <nav class="terminal-nav">
        <a href="/">Home</a>
        <a href="/admin/dashboard" class="active">Admin Dashboard</a>
        <a href="/users">User Directory</a>
        <a href="/search">Search</a>
        <a href="/profile">My Profile</a>
    </nav>

    <div class="admin-container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>TOTAL USERS</h3>
                <div class="value" id="totalUsers">-</div>
            </div>
            <div class="stat-card">
                <h3>TOTAL POSTS</h3>
                <div class="value" id="totalPosts">-</div>
            </div>
            <div class="stat-card">
                <h3>TOTAL WHISPERS</h3>
                <div class="value" id="totalWhispers">-</div>
            </div>
            <div class="stat-card">
                <h3>FORUM TOPICS</h3>
                <div class="value" id="totalTopics">-</div>
            </div>
            <div class="stat-card">
                <h3>NEW USERS (24H)</h3>
                <div class="value" id="recentUsers">-</div>
            </div>
        </div>

        <div class="admin-section">
            <h2>QUICK ACTIONS</h2>
            <div class="admin-actions">
                <button onclick="window.location.href='/admin/users'">Manage Users</button>
                <button onclick="window.location.href='/admin/activity'">View Activity Log</button>
                <button onclick="createAnnouncement()">Create Announcement</button>
                <button onclick="viewReports()">View Reports</button>
            </div>
        </div>

        <div class="admin-section">
            <h2>RECENT ACTIVITY</h2>
            <div class="activity-list" id="activityList">
                <p style="text-align: center; color: #888;">Loading activity...</p>
            </div>
        </div>
    </div>

    <script>
        const data = __DATA__;

        // Display statistics
        if (data.stats) {
            document.getElementById('totalUsers').textContent = data.stats.totalUsers;
            document.getElementById('totalPosts').textContent = data.stats.totalPosts;
            document.getElementById('totalWhispers').textContent = data.stats.totalWhispers;
            document.getElementById('totalTopics').textContent = data.stats.totalTopics;
            document.getElementById('recentUsers').textContent = data.stats.recentUsers;
        }

        // Load recent activity
        async function loadActivity() {
            try {
                const response = await fetch('/admin/activity?limit=20');
                const result = await response.json();

                if (result.success && result.activities) {
                    displayActivity(result.activities);
                }
            } catch (error) {
                console.error('Failed to load activity:', error);
            }
        }

        function displayActivity(activities) {
            const container = document.getElementById('activityList');

            if (activities.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #888;">No recent activity</p>';
                return;
            }

            const html = activities.map(activity => `
                <div class="activity-item">
                    <strong>${activity.users.username}</strong>: ${activity.activity_type}
                    <br>
                    <small style="color: #888;">${new Date(activity.created_at).toLocaleString()}</small>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        function createAnnouncement() {
            const title = prompt('Announcement Title:');
            if (!title) return;

            const content = prompt('Announcement Content:');
            if (!content) return;

            fetch('/admin/announcements', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content })
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    alert('Announcement created successfully!');
                } else {
                    alert('Failed to create announcement: ' + result.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Failed to create announcement');
            });
        }

        function viewReports() {
            alert('Reports feature coming soon...');
        }

        // Load activity on page load
        loadActivity();
    </script>
</body>
</html>
