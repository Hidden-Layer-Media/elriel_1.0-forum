<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGISTER | ELRIEL</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  
  <!-- Unified Stylesheets -->
  <link rel="stylesheet" href="/css/cyberpunk-terminal.css">
  <link rel="stylesheet" href="/css/responsive-fixes.css">
  
  <!-- Core Scripts -->
  <script src="/js/error-logger.js" defer></script>
  <script src="/js/accessibility.js" defer></script>
  <script src="/js/mobile-enhancements.js" defer></script>
  <script src="/js/sidebar-manager.js" defer></script>
</head>
<body class="terminal">
  <!-- Screen Effects -->
  <div class="noise-overlay"></div>
  <div class="scan-lines"></div>
  <div class="crt-effect"></div>
  
  <!-- Main Container -->
  <div class="container">
    <header class="main-header">
      <div class="logo">
        <h1 class="glitch" data-text="ELRIEL">ELRIEL</h1>
        <div class="logo-subtitle">DIGITAL WASTELAND v1.3.7</div>
      </div>
    </header>

    <div class="content-wrapper">
      <!-- Mobile Navigation Toggle -->
      <button type="button" class="mobile-nav-toggle" id="mobile-nav-toggle">TOGGLE NAVIGATION</button>
      
      <nav class="sidebar" id="main-sidebar">
        <div class="nav-section">
          <h3 class="nav-title">MAIN SYSTEMS</h3>
          <ul class="nav-links">
            <li><a href="/">TERMINAL</a></li>
            <li><a href="/feed/bleedstream">BLEEDSTREAM</a></li>
            <li><a href="/glyph/crucible">GLYPH CRUCIBLE</a></li>
            <li><a href="/whisper/board">WHISPERBOARD</a></li>
            <li><a href="/forum/scrapyard">SCRAPYARD</a></li>
          </ul>
        </div>
        <div class="nav-section">
          <h3 class="nav-title">SYSTEM</h3>
          <ul class="nav-links">
            <li><a href="/about">ABOUT</a></li>
            <li><a href="#" id="toggle-glitch">TOGGLE GLITCH</a></li>
          </ul>
        </div>
      </nav>

      <main class="main-content" style="display: flex; align-items: center; justify-content: center;">
        <section class="panel auth-panel" style="max-width: 500px; width: 100%;">
          <div class="scanner-line"></div>
          <div class="panel-header">
            <h2>REGISTER NEW USER</h2>
            <div class="status-indicator">IDENTITY</div>
          </div>
          <div class="panel-content">
            <form id="register-form">
              <div class="form-group">
                <label for="username">USERNAME:</label>
                <input type="text" id="username" name="username" required placeholder="Choose username" autocomplete="username" maxlength="30">
              </div>
              <div class="form-group">
                <label for="email">EMAIL:</label>
                <input type="email" id="email" name="email" required placeholder="Enter email" autocomplete="email">
              </div>
              <div class="form-group">
                <label for="password">PASSWORD:</label>
                <input type="password" id="password" name="password" required placeholder="Enter password" autocomplete="new-password" minlength="6">
              </div>
              <div class="form-group">
                <label for="confirm-password">CONFIRM PASSWORD:</label>
                <input type="password" id="confirm-password" name="confirmPassword" required placeholder="Confirm password" autocomplete="new-password" minlength="6">
              </div>
              <div class="form-actions" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="button auth-button">REGISTER IDENTITY</button>
                <div class="switch-auth" style="text-align: center; font-size: 0.9rem; color: var(--terminal-dim-green);">
                  ALREADY REGISTERED? <a href="/auth/login" style="color: var(--terminal-green);">ACCESS TERMINAL</a>
                </div>
              </div>
            </form>
            <div id="error-message" style="color: var(--terminal-red); margin-top: 1rem; text-align: center;"></div>
          </div>
        </section>
      </main>
    </div>

    <footer class="main-footer">
      <div class="footer-text">ELRIEL NETWORK // ESTABLISHED 2025 // ALL RIGHTS SURRENDERED</div>
      <div class="footer-glyphs">
        <span class="glyph">⌘</span>
        <span class="glyph">⍟</span>
        <span class="glyph">⎔</span>
      </div>
    </footer>
  </div>

  <script>
    // Handle registration
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const errorMessageEl = document.getElementById('error-message');
      errorMessageEl.textContent = '';
      
      // Client-side validation
      if (password !== confirmPassword) {
        errorMessageEl.textContent = 'PASSWORDS DO NOT MATCH.';
        return;
      }
      
      if (password.length < 6) {
        errorMessageEl.textContent = 'PASSWORD MUST BE AT LEAST 6 CHARACTERS.';
        return;
      }
      
      try {
        const response = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password, confirmPassword })
        });
        
        const data = await response.json();
        
        if (data.success) {
          window.location.href = '/profile';
        } else {
          errorMessageEl.textContent = data.message || 'REGISTRATION FAILED. IDENTITY CONFLICT.';
        }
      } catch (error) {
        console.error('Registration error:', error);
        errorMessageEl.textContent = 'SYSTEM ERROR. COULD NOT CONNECT TO REGISTRATION SERVER.';
      }
    });
    
    // Toggle glitch
    document.getElementById('toggle-glitch').addEventListener('click', function(e) {
      e.preventDefault();
      document.body.classList.toggle('glitch-active');
      localStorage.setItem('glitch-active', document.body.classList.contains('glitch-active') ? 'true' : 'false');
    });

    if (localStorage.getItem('glitch-active') === 'true') {
      document.body.classList.add('glitch-active');
    }

    console.log('Register page initialized');
  </script>
</body>
</html>
